name: 모두의 카페 커뮤니티에 GitHub Actions 기반 CI/CD 파이프라인을 구축하고, AWS EC2에 자동 배포

on:
  push:
    branches:
      - main  # 주석 : main 브랜치에 push가 되면 actions가 동작함

#환경변수
env:
  SERVER_IP: ${{vars.SERVER_IP}}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # 1. GitHub 저장소의 소스코드 가져오기
    - name: 소스 check out 
      uses: actions/checkout@v6
    
    # 2. 빌드 환경 설정
    - name: Java 8 설정
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '8'
        cache: maven
    
    # 3. EC2 배포 전용 설정값 입력
    - name: 배포용 설정 파일 생성
      run: |
        cat > src/main/resources/db.properties <<'EOF'
        db.driver=oracle.jdbc.OracleDriver
        db.url=${DB_URL}
        db.username=${DB_USERNAME}
        db.password=${DB_PASSWORD}
        EOF

        cat > src/main/resources/upload.properties <<'EOF'
        upload.root=/data/uploads
        EOF
    
    # 4. Maven으로 WAR 파일 생성
    - name: 메이븐 빌드
      run: mvn clean package -DskipTests
    
    # 5. Docker 이미지 생성
    - name: Build Docker Image
      run: |
        docker build \
          -t ${{secrets.DOCKERHUB_USERNAME}}/deepstudy:latest \
          .

    # 6. Docker Hub 로그인
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{secrets.DOCKERHUB_USERNAME}}
        password: ${{secrets.DOCKERHUB_PASSWORD}}
        
    # 7. Docker Hub에 이미지 업로드
    - name: Push Docker Image
      run: |
        docker push \
          ${{secrets.DOCKERHUB_USERNAME}}/deepstudy:latest
          
    # 8. 배포 설정 파일을 EC2로 복사
    - name: 배포 설정 파일을 EC2로 복사
      uses: appleboy/scp-action@v1
      with:
        host: ${{env.SERVER_IP}}
        username: ubuntu
        key: ${{secrets.SERVER_SSH_KEY}}
        source: "compose.yaml,deploy/nginx/default.conf,deploy/tomcat/ROOT.xml,deploy/scripts/backup-db.sh,deploy/scripts/renew-cert.sh"
        target: /home/ubuntu/deepstudy-deploy
        overwrite: true      
    
    # 9. EC2 접속 후 컨테이너 배포
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.2.5
      env:
        DB_URL: ${{secrets.DB_URL}}
        DB_USERNAME: ${{secrets.DB_USERNAME}}
        DB_PASSWORD: ${{secrets.DB_PASSWORD}}
      with:
        host: ${{env.SERVER_IP}}
        username: ubuntu
        key: ${{secrets.SERVER_SSH_KEY}}
        envs: DB_URL,DB_USERNAME,DB_PASSWORD
        script: |
          set -e
          
          command -v curl >/dev/null  # 기존 컨테이너를 중지하기 전에 확인 도구가 있는지 검사
          docker compose version
          
          cd /home/ubuntu/deepstudy-deploy
          
          # Github Secrets의 DB 정보를 EC2 설정 파일에 반영
          : "${DB_URL:?DB_URL is required}"
          : "${DB_USERNAME:?DB_USERNAME is required}"
          : "${DB_PASSWORD:?DB_PASSWORD is required}"
          
          umask 077
          printf '%s\n' \
            "DB_URL=$DB_URL" \
            "DB_USERNAME=$DB_USERNAME" \
            "DB_PASSWORD=$DB_PASSWORD" \
            > app.env.tmp
            
          chmod 600 app.env.tmp
          mv -f app.env.tmp app.env
          
          # 설정 확인 -> 새 이미지 다운로드 -> 앱 교체
          docker compose config --quiet
          docker compose pull app
          
          # 새 위치의 Nginx 설정 검사 및 연결 경로 적용
          docker compose run --rm --no-deps nginx nginx -t
          docker compose up -d --no-deps nginx
          
          # Tomcat에 등록한 신뢰 IP와 일치하는지 확인
          nginx_ip=$(docker inspect \
            --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' \
            "$(docker compose ps -q nginx)")
          
          if [ "$nginx_ip" != "172.19.0.2" ]; then
            echo "Nginx IP 변경됨: $nginx_ip — ROOT.xml 신뢰 IP 확인 필요"
            exit 1
          fi
          
          docker compose up -d --no-deps app
          docker compose exec -T nginx nginx -s reload
          
          # Tomcat과 애플리케이션 기동을 기다리면서 확인
          for attempt in $(seq 1 30); do
            if status=$(curl --silent --show-error \
              --connect-timeout 2 \
              --max-time 5 \
              --output /dev/null \
              --write-out '%{http_code}' \
              http://127.0.0.1:8080/cafe); then
              
              if [ "$status" = "200" ]; then
                echo "배포 확인 성공: /cafe HTTP 200"
                exit 0
              fi
            fi
            
            echo "애플리케이션 기동 대기: $attempt/30"
            sleep 3
          done
          
          echo "배포 확인 실패: /cafe 정상 응답 없음"
          exit 1
          