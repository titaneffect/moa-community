name: 모두의 카페 커뮤니티에 GitHub Actions 기반 CI/CD 파이프라인을 구축하고, AWS EC2에 자동 배포

on:
  push:
    branches:
      - main  # 주석 : main 브랜치에 push가 되면 actions가 동작함

#환경변수
env:
  SERVER_IP: ${{vars.SERVER_IP}}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # 1. GitHub 저장소의 소스코드 가져오기
    - name: 소스 check out 
      uses: actions/checkout@v6
    
    # 2. 빌드 환경 설정
    - name: Java 8 설정
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '8'
        cache: maven
    
    # 3. EC2 배포 전용 설정값 입력
    - name: 배포용 설정 파일 생성
      run: |
        cat > src/main/resources/db.properties <<'EOF'
        db.driver=oracle.jdbc.OracleDriver
        db.url=${DB_URL}
        db.username=${DB_USERNAME}
        db.password=${DB_PASSWORD}
        EOF

        cat > src/main/resources/upload.properties <<'EOF'
        upload.root=/data/uploads
        EOF
    
    # 4. Maven으로 WAR 파일 생성
    - name: 메이븐 빌드
      run: mvn clean package -DskipTests
    
    # 5. Docker 이미지 생성
    - name: Build Docker Image
      run: |
        docker build \
          -t ${{secrets.DOCKERHUB_USERNAME}}/deepstudy:latest \
          .

    # 6. Docker Hub 로그인
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{secrets.DOCKERHUB_USERNAME}}
        password: ${{secrets.DOCKERHUB_PASSWORD}}
        
    # 7. Docker Hub에 이미지 업로드
    - name: Push Docker Image
      run: |
        docker push \
          ${{secrets.DOCKERHUB_USERNAME}}/deepstudy:latest
          
    # 8. EC2 접속 후 컨테이너 배포
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.2.5
      env:
        DB_URL: ${{secrets.DB_URL}}
        DB_USERNAME: ${{secrets.DB_USERNAME}}
        DB_PASSWORD: ${{secrets.DB_PASSWORD}}
        IMAGE: ${{secrets.DOCKERHUB_USERNAME}}/deepstudy:latest
      with:
        host: ${{env.SERVER_IP}}
        username: ubuntu
        key: ${{secrets.SERVER_SSH_KEY}}
        envs: DB_URL,DB_USERNAME,DB_PASSWORD,IMAGE
        script: |
          set -e
          
          docker pull "$IMAGE"

          docker stop deepstudy || true
          docker rm deepstudy || true

          docker run -d \
            --name deepstudy \
            --restart unless-stopped \
            --network host \
            -e DB_URL \
            -e DB_USERNAME \
            -e DB_PASSWORD \
            -v /home/ubuntu/deepstudy-uploads:/data/uploads \
            "$IMAGE"
