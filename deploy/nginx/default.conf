# HTTP 요청: 인증 확인 경로는 유지하고, 나머지는 HTTPS로 이동
server {
    listen 80;
    server_name moducafe.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
	return 301 https://moducafe.duckdns.org$request_uri;
    }
}

# HTTPS 요청: 인증서로 연결을 처리한 뒤 Tomcat으로 전달
server {
    listen 443 ssl;
    server_name moducafe.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/moducafe.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moducafe.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

	# Tomcat이 HTTP 절대 주소로 이동시키면 HTTPS 주소로 바꿔 전달
        proxy_redirect ~^http://[^/]+(/.*)$ https://$host$1;
    }
}
